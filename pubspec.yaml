name: vehicle_tablet_ui
description: Segregated Flutter tablet vehicle dashboard UI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.13
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  http: ^1.6.0
  model_viewer_plus: ^1.9.3
  permission_handler: 12.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/car_models/
